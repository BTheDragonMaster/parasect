[pytest]
testpaths = tests

# src/parasect/model_training/rf/test_rf.py is random forest evaluation code,
# not a test suite; it matches pytest's test_*.py pattern by name only.
# testpaths already keeps it out of a bare `pytest` run, and this keeps it out
# of an explicit `pytest src/` too.
addopts = --ignore=src/parasect/model_training/rf/test_rf.py

markers =
    integration: Mark a test as an integration test.
