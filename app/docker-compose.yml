services:
  redis:
    image: redis:7-alpine
    restart: always
    container_name: paras-redis
    # Job results only, not durable app state: an AOF/RDB volume isn't
    # needed since every key already carries a 7-day TTL (see job_store.py).
    networks: [paras-network]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  paras-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: paras-server
    restart: always
    env_file:
      - .env  # Need secrets for submitting newly annotated domains
    container_name: paras-server
    volumes:
      - ./models:/app/models:ro
    environment:
      - MODEL_DIR=/app/models
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/0
      # Single host today: worker processes share the model's mmap'd pages
      # via the OS page cache, so extra workers are cheap in RAM. Job state
      # now lives in Redis, so this is safe to raise above 1.
      - GUNICORN_WORKERS=2
      - GUNICORN_THREADS=4
      # Also set in Dockerfile, can override here
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
      - JOBLIB_MMAP_MODE=r
    networks: [paras-network]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # Use base Python; no curl/wget dependency needed
      test: [ "CMD", "/opt/conda/bin/python", "-c",
              "import urllib.request,sys; urllib.request.urlopen('http://localhost:4009/health', timeout=2); sys.exit(0)" ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  paras-client:
    build: 
      context: . 
      dockerfile: Dockerfile.client 
      args:
        - REACT_APP_TURNSTILE_SITE_KEY=${REACT_APP_TURNSTILE_SITE_KEY}
    image: paras-client
    ports:
      - "4010:80"
    restart: always
    container_name: paras-client
    networks: [paras-network]
    depends_on:
      - paras-server

networks:
  paras-network:
    driver: bridge